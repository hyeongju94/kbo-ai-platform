# Airflow 서비스 공통 설정 (아래 airflow-* 서비스가 <<: *airflow-common 으로 가져다 씀)
x-airflow-common: &airflow-common
  build: docker/airflow
  image: kbo-airflow:local
  env_file: .env.mlops
  environment: &airflow-env
    # 메타DB 접속 문자열을 .env.mlops 의 AIRFLOW_DB_* 로 조립 (docker exec 로 airflow CLI 를 쓸 때도 적용됨)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
      sh -c 'printf %s "postgresql+psycopg2://$${AIRFLOW_DB_USER}:$${AIRFLOW_DB_PASSWORD}@postgres:5432/$${AIRFLOW_DB_NAME}"'
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "4"              # 동시에 도는 태스크 수 (메모리 3.8GB 기준)
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # 태스크 코드에서 쓰는 값 (mlflow.set_tracking_uri 생략 가능)
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PYTHONPATH: /opt/airflow/project/src     # 레포의 src/ (kbo_ai_platform 패키지)
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./src:/opt/airflow/project/src:ro
  user: "50000:0"

services:
  postgres:
    image: postgres:16
    container_name: kbo-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- MLOps: MinIO (S3 호환 저장소) + MLflow + Airflow ----------
  # 설정은 .env.mlops (cp .env.mlops.example .env.mlops). postgres 서비스 정의는 건드리지 않고,
  # MLOps 서비스는 postgres 에 depends_on 을 걸지 않는다 (실행 중인 Postgres 를 재생성하지 않도록).

  minio:
    build: docker/minio
    image: kbo-minio:local
    container_name: kbo-minio
    restart: unless-stopped
    env_file: .env.mlops
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # 웹 콘솔
    volumes:
      - miniodata:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://$${MINIO_ROOT_USER}:$${MINIO_ROOT_PASSWORD}@localhost:9000 mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 버킷을 만들고 종료하는 1회성 컨테이너
  minio-init:
    image: kbo-minio:local
    container_name: kbo-minio-init
    env_file: .env.mlops
    entrypoint: ["sh", "/scripts/create_buckets.sh"]
    volumes:
      - ./db/mlops/create_buckets.sh:/scripts/create_buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  # 기존 Postgres 안에 MLflow·Airflow 전용 계정·DB(mlflow, airflow)를 만들고 종료하는 1회성 컨테이너
  mlops-db-init:
    image: postgres:16
    container_name: kbo-mlops-db-init
    env_file: [.env, .env.mlops]
    entrypoint: ["sh", "/scripts/create_service_dbs.sh"]
    volumes:
      - ./db/mlops/create_service_dbs.sh:/scripts/create_service_dbs.sh:ro

  mlflow:
    build: docker/mlflow
    image: kbo-mlflow:local
    container_name: kbo-mlflow
    restart: unless-stopped
    env_file: .env.mlops
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # GenAI 평가용 백그라운드 작업(huey 워커 ~2GB)을 끔. 일반 실험 추적·모델 레지스트리에는 필요 없음
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    # 실행 기록 → Postgres 의 mlflow DB, 아티팩트 → MinIO 버킷 (클라이언트는 서버를 거쳐 올림)
    command:
      - sh
      - -c
      - >-
        export AWS_ACCESS_KEY_ID="$$MINIO_ROOT_USER" AWS_SECRET_ACCESS_KEY="$$MINIO_ROOT_PASSWORD" &&
        exec mlflow server
        --host 0.0.0.0 --port 5000 --workers 2
        --backend-store-uri "postgresql://$$MLFLOW_DB_USER:$$MLFLOW_DB_PASSWORD@postgres:5432/$$MLFLOW_DB_NAME"
        --artifacts-destination "s3://$$MLFLOW_ARTIFACT_BUCKET"
        --serve-artifacts
        --allowed-hosts "localhost,localhost:5000,localhost:5001,127.0.0.1,127.0.0.1:5000,127.0.0.1:5001,mlflow,mlflow:5000"
    ports:
      - "127.0.0.1:5001:5000"   # macOS 는 5000 을 AirPlay 가 쓰므로 5001
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mlops-db-init:
        condition: service_completed_successfully

  # 메타DB 마이그레이션 + 관리자 비밀번호 + Connections(kbo_postgres, mlflow_http, minio_s3) 등록 후 종료
  airflow-init:
    <<: *airflow-common
    container_name: kbo-airflow-init
    env_file: [.env, .env.mlops]        # kbo_postgres 연결을 만들려고 .env 도 읽음
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint", "bash", "/opt/kbo/init.sh"]
    volumes:
      - ./airflow/config:/opt/airflow/config
      - ./docker/airflow/init.sh:/opt/kbo/init.sh:ro
    depends_on:
      mlops-db-init:
        condition: service_completed_successfully

  airflow-apiserver:   # 웹 UI + REST API (Airflow 3 에서 webserver 를 대체)
    <<: *airflow-common
    container_name: kbo-airflow-apiserver
    command: api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:   # 스케줄링 + LocalExecutor (태스크도 이 컨테이너 안에서 실행됨)
    <<: *airflow-common
    container_name: kbo-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:   # airflow/dags 의 DAG 파일을 읽어 등록 (Airflow 3 부터 별도 프로세스)
    <<: *airflow-common
    container_name: kbo-airflow-dag-processor
    command: dag-processor
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
